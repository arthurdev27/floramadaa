html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.btn-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,var(--shine,rgba(255,255,255,.38)) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}
.btn-shine:hover::after{transform:translateX(120%)}
.soc:hover{background:var(--h);color:#fff;border-color:transparent}
.font-serif{font-weight:400!important;letter-spacing:.01em}
.arch{border-radius:999px 999px 18px 18px}
.zoom img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.07)}
.pulse{animation:pulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.zoom img{transition:none}html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>

function pick(n){
  if(BRAND[n])return BRAND[n];
  const L=window.lucide&&lucide.icons; if(!L)return [];
  const v=L[n]||L[n.replace(/[A-Z]/g,(c,i)=>(i?"-":"")+c.toLowerCase())]||[];
  return v[0]==="svg"?v[2]:v;
}
function Icon({n,size=20,className=""}){

  const [i,setI]=useState(0); const r=REVIEWS[i]; const go=d=>setI((i+d+REVIEWS.length)%REVIEWS.length);
  return <section id="avaliacoes" className="py-16 lg:py-24">
    <div className="mx-auto grid max-w-6xl gap-10 px-4 sm:px-8 lg:grid-cols-[1fr_1.4fr] lg:items-center">
      <div>
        <h2 className="font-serif text-4xl sm:text-5xl">Quem conhece, recomenda.</h2>
        <div className="mt-5 flex items-center gap-3"><span className="font-serif text-5xl">5,0</span>
          <div><div className="flex text-gold">{[0,1,2,3,4].map(k=><Icon key={k} n="Star" size={18} className="fill-current"/>)}</div><p className="mt-1 text-xs text-mute">Avaliações no Google</p></div></div>
      </div>
      <figure className="relative rounded-3xl border border-line bg-card p-7 sm:p-10">
        <Icon n="Quote" size={34} className="text-rose"/>
        <blockquote key={i} className="mt-4 font-serif text-xl leading-8 sm:text-2xl sm:leading-9">“{r.q}”</blockquote>
        <figcaption className="mt-6 flex flex-wrap items-center justify-between gap-4">
          <div><div className="flex text-gold">{[0,1,2,3,4].map(k=><Icon key={k} n="Star" size={15} className="fill-current"/>)}</div><p className="mt-2 text-sm font-medium">{r.a}</p><p className="text-xs text-mute">{r.s}</p></div>
          <div className="flex gap-2">
            <button onClick={()=>go(-1)} aria-label="Depoimento anterior" className="grid h-11 w-11 place-items-center rounded-full border border-line transition-colors hover:border-gold hover:text-gold"><Icon n="ChevronLeft"/></button>
            <button onClick={()=>go(1)} aria-label="Próximo depoimento" className="grid h-11 w-11 place-items-center rounded-full border border-line transition-colors hover:border-gold hover:text-gold"><Icon n="ChevronRight"/></button>
          </div>
        </figcaption>
      </figure>
    </div>
  </section>;
}

function MapEmbed(){
  return <div className="overflow-hidden rounded-3xl border border-line bg-card">
    <iframe title="Mapa da loja Flor Amada em Rio das Ostras" src={`https://www.google.com/maps?q=${encodeURIComponent(GEO)}&hl=pt-BR&z=17&output=embed`} className="block h-[360px] w-full border-0 sm:h-[460px]" loading="lazy" referrerPolicy="no-referrer-when-downgrade" allowFullScreen/>
    <div className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
      <p className="flex items-start gap-2 text-xs leading-5 text-mute"><Icon n="MapPin" size={16} className="mt-0.5 shrink-0 text-gold"/>{ADDRESS}</p>
      <a href={MAPS} target="_blank" rel="noopener noreferrer" className="btn-shine relative inline-flex shrink-0 items-center justify-center gap-2 overflow-hidden rounded-full bg-ink px-4 py-2.5 text-xs font-medium transition-transform active:scale-95" style={{color:"var(--bg)"}}><Icon n="ExternalLink" size={15}/>Abrir no Google Maps</a>
    </div>
  </div>;
}

function Location(){
  return <section id="local" className="bg-bg2 py-16 lg:py-24">
    <div className="mx-auto grid max-w-7xl gap-8 px-4 sm:px-8 lg:grid-cols-[1fr_1.3fr]">
      <div>
        <h2 className="font-serif text-4xl sm:text-5xl">Venha nos visitar</h2>
        <ul className="mt-8 space-y-6 text-sm">
          <li className="flex gap-4"><Icon n="MapPin" className="mt-0.5 shrink-0 text-gold"/><div><p className="font-medium">Endereço</p><p className="mt-1 leading-6 text-mute">Rua Nova Iguaçu, 668 - Loja 07<br/>Jardim Mariléa, Rio das Ostras - RJ<br/>CEP 28895-880</p></div></li>
          <li className="flex gap-4"><Icon n="Clock" className="mt-0.5 shrink-0 text-gold"/><div><p className="font-medium">Horário de funcionamento</p><p className="mt-1 leading-6 text-mute">Segunda a sexta: 10h às 19h<br/>Sábado: 9h às 17h</p></div></li>
          <li className="flex gap-4"><Icon n="Phone" className="mt-0.5 shrink-0 text-gold"/><div><p className="font-medium">WhatsApp</p><a href={wa("Olá! Gostaria de mais informações.")} target="_blank" rel="noopener noreferrer" className="mt-1 block text-mute transition-colors hover:text-gold">{PHONE}</a></div></li>
        </ul>
        <div className="mt-8 flex flex-wrap gap-3">
          <Btn href={wa("Olá! Gostaria de mais informações sobre a loja.")} icon="WhatsApp">Chamar no WhatsApp</Btn>
          <Btn href={DIR} icon="Navigation" tone="ghost">Como chegar</Btn>
        </div>
      </div>
      <MapEmbed/>
    </div>
  </section>;
}

function Footer(){
  const [lgpd,setLgpd]=useState(false);
  return <footer className="border-t border-line py-10 pb-28">
    <div className="mx-auto max-w-7xl px-4 sm:px-8">
      <div className="flex flex-col items-center justify-between gap-6 sm:flex-row">
        <div className="text-center sm:text-left"><p className="font-serif text-2xl">Flor Amada</p><p className="mt-1 text-xs text-mute">Semijoias & Acessórios · Rio das Ostras - RJ</p></div>
        <div className="flex items-center gap-3">
          <a href={IG} target="_blank" rel="noopener noreferrer" aria-label="Instagram @floramadaoficial" className="soc grid h-11 w-11 place-items-center rounded-full border border-line bg-card transition-all duration-300 hover:-translate-y-1 hover:rotate-6 active:scale-90" style={{"--h":"linear-gradient(45deg,#F9A03F,#E1306C,#833AB4)"}}><Icon n="Instagram"/></a>
          <a href={FB} target="_blank" rel="noopener noreferrer" aria-label="Facebook da Flor Amada" className="soc grid h-11 w-11 place-items-center rounded-full border border-line bg-card transition-all duration-300 hover:-translate-y-1 hover:rotate-6 active:scale-90" style={{"--h":"#1877F2"}}><Icon n="Facebook"/></a>
          <button onClick={()=>setLgpd(!lgpd)} aria-expanded={lgpd} className="flex items-center gap-2 rounded-full border border-line px-4 py-2.5 text-xs transition-colors hover:border-gold hover:text-gold"><Icon n="ShieldCheck" size={16}/>Privacidade (LGPD)</button>
        </div>
      </div>
      {lgpd&&<p className="mt-6 rounded-2xl bg-card p-4 text-xs leading-6 text-mute">Este site não coleta dados pessoais. Ao tocar nos botões de compra, você é direcionado ao WhatsApp e a conversa segue as regras do aplicativo.</p>}
      <div className="mt-8 flex flex-col items-center gap-3 border-t border-line pt-6 text-center text-xs text-mute sm:flex-row sm:justify-center">
        <p>© {new Date().getFullYear()} {OWNER}. Todos os direitos reservados.</p>
              </div>
    </div>
  </footer>;
}

function Dial(){
  const [o,setO]=useState(false);
  const it=[["WhatsApp","WhatsApp",wa("Olá! Vim pelo site da Flor Amada."),"#25D366"],["Instagram","Instagram",IG,"#E1306C"],["Facebook","Facebook",FB,"#1877F2"],["MapPin","Como chegar",MAPS,"#C28B7C"]];
  return <div className="fixed right-4 z-50 flex flex-col items-end gap-3" style={{bottom:"calc(env(safe-area-inset-bottom,0px) + 16px)"}}>
    {it.map(([ic,l,hr,c],i)=><a key={l} href={hr} target="_blank" rel="noopener noreferrer" aria-label={l} tabIndex={o?0:-1} className="group flex items-center gap-3 transition-all duration-300" style={{opacity:o?1:0,transform:o?"none":"translateY(16px) scale(.8)",pointerEvents:o?"auto":"none",transitionDelay:o?`${(it.length-i)*45}ms`:"0ms"}}>
      <span className="rounded-full border border-line bg-card px-3 py-1.5 text-xs font-medium shadow">{l}</span>
      <span className="grid h-12 w-12 place-items-center rounded-full text-white shadow-lg transition-transform duration-300 group-hover:scale-110 group-active:scale-90" style={{background:c}}><Icon n={ic} size={22}/></span></a>)}
    <button onClick={()=>setO(!o)} aria-expanded={o} aria-label={o?"Fechar contatos":"Abrir contatos"} className="grid h-14 w-14 place-items-center rounded-full shadow-xl transition-transform hover:scale-110 active:scale-90" style={{background:"#4A3B35",color:"#F7F1E8"}}>
      <span className="transition-transform duration-300" style={{transform:o?"rotate(90deg)":"none"}}><Icon n={o?"X":"MessageCircle"} size={26}/></span></button>
  </div>;
}

function App(){
  return <>
    <Header/><main><Hero/><Collections/><Consultora/><Reviews/><Location/></main><Footer/>
    <Dial/>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
